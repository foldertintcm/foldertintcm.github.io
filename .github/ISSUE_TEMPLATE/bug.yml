name: "Reportar un error · Report a bug"
description: "Algo no funciona como debería · Something does not work as it should"
title: "[Error] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Este repositorio es público.** No adjuntes capturas ni textos con datos personales, contraseñas o información de tu empresa.
        **This repository is public.** Do not attach screenshots or text with personal data, passwords or company information.
  - type: input
    id: version
    attributes:
      label: "Versión de FolderTintCM · FolderTintCM version"
      description: "Configuración → Aplicaciones → FolderTintCM · Settings → Apps → FolderTintCM"
      placeholder: "0.3.1"
    validations:
      required: true
  - type: dropdown
    id: windows
    attributes:
      label: "Versión de Windows · Windows version"
      options:
        - "Windows 11"
        - "Windows 10"
    validations:
      required: true
  - type: input
    id: build
    attributes:
      label: "Compilación de Windows (opcional) · Windows build (optional)"
      description: "Win + R → winver"
      placeholder: "24H2 (26100.xxxx)"
  - type: textarea
    id: steps
    attributes:
      label: "Pasos para reproducirlo · Steps to reproduce"
      placeholder: |
        1. Clic derecho en una carpeta → FolderTintCM → Azul · Right-click a folder → FolderTintCM → Blue
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "Qué esperabas · What you expected"
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: "Qué pasó · What happened"
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: "Dónde está la carpeta (opcional) · Where the folder is (optional)"
      description: "Disco local, USB, unidad de red, OneDrive… · Local disk, USB, network drive, OneDrive…"
  - type: checkboxes
    id: privacy
    attributes:
      label: "Privacidad · Privacy"
      options:
        - label: "Lo que adjunto no contiene datos personales ni sensibles · What I attach contains no personal or sensitive data"
          required: true
